# OUTIL TEMPORAIRE (branche de travail uniquement, retiré avant la fusion dans main).
# Génère la migration Payload, les types et l'importMap quand le message de commit contient
# « [generer] », puis les ajoute à la branche. Base vierge = même état que la production.
name: Générer migration (temporaire)

on:
  push:
    branches: [crm-etape-4]

permissions:
  contents: write

jobs:
  generer:
    if: contains(github.event.head_commit.message, '[generer]')
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cms
          POSTGRES_PASSWORD: cms
          POSTGRES_DB: cms
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cms" --health-interval 5s --health-retries 10
    env:
      PAYLOAD_SECRET: ci-secret
      DATABASE_URI: postgres://cms:cms@localhost:5432/cms
      DB_PUSH: "false"
      # Stockage photos activé comme en production (sinon la colonne media._objectkey semble « en trop »).
      # Valeurs factices : rien n'est envoyé, le stockage n'est pas contacté pendant la génération.
      S3_BUCKET: media
      S3_ENDPOINT: http://localhost:9000
      S3_REGION: auto
      S3_ACCESS_KEY_ID: factice
      S3_SECRET_ACCESS_KEY: factice
      S3_FORCE_PATH_STYLE: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Base vierge à l'état de la production
        working-directory: apps/cms
        run: pnpm payload migrate
      - name: Nouvelle migration
        working-directory: apps/cms
        run: pnpm payload migrate:create crm_v3 < /dev/null
      - name: Types et importMap
        working-directory: apps/cms
        run: |
          pnpm generate:types
          pnpm generate:importmap
      - name: Contrôle (migration additive uniquement)
        working-directory: apps/cms
        run: |
          f=$(ls src/migrations/*crm_v3.ts)
          echo "Fichier : $f"
          # « ON DELETE set null » (règle de clé étrangère) n'est pas une suppression de données
          bad=$(sed -n '/async function up/,/async function down/p' "$f" | grep -nE 'DROP|RENAME|SET DATA TYPE|DELETE' | grep -v 'ON DELETE' || true)
          if [ -n "$bad" ]; then
            echo "$bad" | head -20 | while IFS= read -r l; do echo "::warning::$l"; done
            echo "::error::La migration contient une opération destructive."; exit 1
          fi
          echo "::notice::$(grep -c 'CREATE TABLE' "$f") table(s) créée(s), aucune opération destructive."
      - name: Ajout à la branche
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/cms/src/migrations apps/cms/src/payload-types.ts "apps/cms/src/app/(payload)/admin/importMap.js"
          git commit -m "CRM : migration crm_v3, types et importMap générés"
          git push
